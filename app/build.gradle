plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.jetbrains.kotlin.compose)
}

android {
    namespace 'id.web2apk'
    compileSdk 35

    defaultConfig {
        applicationId "id.web2apk"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    signingConfigs {
        // Web2APK: keystore tetap (JKS) dari secret CI sejak rilis pertama.
        pinned {
            storeFile file(System.getenv("WEB2APK_STORE_FILE") ?: "/nonexistent/web2apk-pinned.keystore")
            storePassword System.getenv("WEB2APK_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("WEB2APK_KEY_ALIAS") ?: "web2apk"
            keyPassword System.getenv("WEB2APK_KEY_PASSWORD") ?: "android"
            storeType "jks"
        }
    }

    buildTypes {
        release {
            if (System.getenv("WEB2APK_STORE_FILE")) {
                signingConfig signingConfigs.pinned
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            if (System.getenv("WEB2APK_STORE_FILE")) {
                signingConfig signingConfigs.pinned
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.core.ktx
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
}
